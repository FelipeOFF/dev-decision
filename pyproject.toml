[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "specgate-client"
version = "0.1.0"
description = "Public clients and harness integrations for Specgate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.0",
    "mcp==2.2.0",
    "pydantic>=2.13.5",
]

[project.scripts]
specgate = "specgate.public_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specgate"]

[tool.hatch.build.targets.sdist]
include = ["src/specgate", "README.md", "LICENSE"]
